<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绿鳄王·虫虫大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232E9E5B'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle'%3E%F0%9F%90%9C%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#2E9E5B; --green-dark:#1F7A45; --green-deep:#173B2A;
  --yellow:#FFC53D; --orange:#FF8A3D; --red:#E85D5D;
  --bg1:#EAF7EF; --bg2:#DDF0E4; --card:#FFFFFF;
  --shadow:0 10px 30px rgba(23,59,42,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--green-deep);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#app{width:100%;max-width:560px}
.screen{background:var(--card);border-radius:28px;box-shadow:var(--shadow);
  padding:28px 24px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:900;line-height:1.2;text-align:center}
.sub{text-align:center;color:#5a7a68;font-size:15px;margin-top:8px}
.mascot{display:block;margin:0 auto 8px;width:150px;height:150px}
.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;border-radius:18px;font-size:19px;padding:17px;color:#fff;
  background:var(--green);min-height:54px;transition:transform .1s,background .2s;
  box-shadow:0 6px 0 var(--green-dark)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-dark)}
.btn.ghost{background:#eef6f1;color:var(--green-dark);box-shadow:0 6px 0 #cfe4d8}
.btn.ghost:active{box-shadow:0 2px 0 #cfe4d8}
.btn.gold{background:var(--yellow);color:#7a5200;box-shadow:0 6px 0 #e0a81f}
.btn.gold:active{box-shadow:0 2px 0 #e0a81f}
.mt12{margin-top:12px}.mt16{margin-top:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lvl-name{font-size:17px;font-weight:700}
.progress{height:12px;background:#e6f1ea;border-radius:8px;overflow:hidden;margin:6px 0 18px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#58c984);
  border-radius:8px;transition:width .3s}
.qbox{background:#f4faf6;border-radius:22px;padding:22px 18px;margin-bottom:18px}
.qctx{font-size:19px;line-height:1.65;font-weight:600}
.qctx b{color:var(--orange)}
.qhint{font-size:14px;color:#7b9686;margin-top:10px;font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid #dcebe2;background:#fff;border-radius:18px;font-size:26px;font-weight:700;
  padding:18px 0;cursor:pointer;font-family:inherit;color:var(--green-deep);min-height:64px;
  transition:transform .1s,background .15s,border-color .15s}
.opts.txt .opt{font-size:19px;padding:14px 6px}
.inputrow{display:flex;gap:12px;align-items:stretch}
.ansinput{flex:1;border:3px solid #dcebe2;background:#fff;border-radius:18px;font-size:28px;
  font-weight:800;text-align:center;font-family:inherit;color:var(--green-deep);padding:14px;
  min-height:64px;outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none}
.ansinput::placeholder{font-size:17px;font-weight:600;color:#a8bfb3}
.ansinput:focus{border-color:var(--green)}
.ansinput.right{border-color:var(--green);background:#eaf7ef;color:var(--green-dark)}
.ansinput.wrong{border-color:var(--red);background:#fdeeee}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.opt.show{background:var(--green);border-color:var(--green);color:#fff}
.opt:disabled{cursor:default}
.feedback{text-align:center;font-size:17px;font-weight:700;min-height:28px;margin-top:14px;line-height:1.5}
.feedback.good{color:var(--green-dark)}.feedback.bad{color:var(--orange)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.level-card{position:relative;border:3px solid #dcebe2;border-radius:18px;padding:14px 10px;
  text-align:center;cursor:pointer;background:#fff;transition:transform .1s}
.level-card:active{transform:scale(.96)}
.level-card .le{font-size:26px;line-height:1.1}
.level-card .n{font-size:17px;font-weight:900;margin-top:2px}
.level-card .t{font-size:12px;color:#6b8a79;margin-top:2px}
.level-card.locked{background:#f1f4f2;cursor:not-allowed;color:#9db0a6}
.level-card.locked .t{color:#9db0a6}
.stars{margin-top:6px;font-size:15px;letter-spacing:2px;color:#d8d8d8}
.stars .on{color:var(--yellow)}
.bigstars{text-align:center;font-size:52px;letter-spacing:6px;margin:10px 0;color:#d8d8d8}
.bigstars .on{color:var(--yellow);animation:starPop .5s ease both}
.bigstars .on:nth-child(2){animation-delay:.15s}.bigstars .on:nth-child(3){animation-delay:.3s}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.scoreline{text-align:center;font-size:18px;font-weight:700;margin-bottom:6px}
.sound{position:absolute;top:12px;right:12px;background:#fff;border:2px solid #dcebe2;
  border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.badge{display:inline-block;background:#eaf7ef;color:var(--green-dark);border-radius:999px;
  padding:4px 14px;font-size:13px;font-weight:700;margin-top:10px}
.combo-badge{font-size:13px;font-weight:900;color:#fff;background:var(--orange);border-radius:999px;
  padding:3px 10px;margin-left:8px;display:inline-block;animation:comboPop .3s ease}
@keyframes comboPop{from{transform:scale(.5)}to{transform:scale(1)}}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--orange);color:#fff;font-weight:900;font-size:20px;padding:10px 22px;
  border-radius:999px;opacity:0;pointer-events:none;z-index:50;box-shadow:0 8px 20px rgba(255,138,61,.45);
  transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(23,59,42,.45);z-index:60;padding:24px}
#overlay.show{display:flex}
.ach-pop{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.3);animation:achIn .4s cubic-bezier(.2,1.2,.4,1) both}
@keyframes achIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ach-icon{font-size:56px;line-height:1}
.ach-title{font-size:14px;color:var(--green);font-weight:900;letter-spacing:2px;margin-top:6px}
.ach-name{font-size:24px;font-weight:900;margin-top:2px}
.ach-desc{font-size:15px;color:#5a7a68;margin-top:8px}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.timer .tnum{font-weight:900;font-size:16px;color:var(--orange);min-width:46px}
.timer .tbar{flex:1;height:10px;background:#ffe9d6;border-radius:6px;overflow:hidden}
.timer .tbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#FF6B3D);
  border-radius:6px;transition:width .1s linear}
.ach-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.ach-item{display:flex;align-items:center;gap:8px;background:#f4faf6;border-radius:14px;padding:10px 12px;font-size:13px}
.ach-item.locked{opacity:.45}
.ach-item .ai{font-size:22px}
/* 生物卡 */
.bcard{background:linear-gradient(160deg,#f2fbf5,#e4f5ea);border-radius:20px;
  padding:18px;text-align:center;margin:14px 0;border:2px dashed #bfe3cd;
  animation:cardJump .75s cubic-bezier(.2,1.3,.4,1) both}
.bcard .be{font-size:72px;line-height:1.15}
.bcard .bn{font-size:19px;font-weight:900;margin-top:4px}
.bcard .bf{font-size:14px;color:#4d6e5c;line-height:1.6;margin-top:8px;text-align:left}
.bcard .newtag{font-size:11px;background:var(--orange);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
@keyframes cardJump{0%{transform:scale(.3) translateY(20px);opacity:0}
  55%{transform:scale(1.12) translateY(-6px);opacity:1}100%{transform:scale(1) translateY(0)}}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.card-item{border:2px solid #dcebe2;border-radius:16px;padding:14px 10px;text-align:center;background:#fff}
.card-item.locked{background:#f1f4f2;color:#9db0a6}
.card-item .ce{font-size:64px;line-height:1.15}
.card-item.locked .ce{filter:grayscale(1);opacity:.35}
.card-item .cn{font-size:15px;font-weight:900;margin-top:6px}
.card-item .ctime{font-size:11px;color:#6b8a79;margin-top:3px;font-weight:700}
.card-item.locked .ctime{color:#9db0a6}
.card-item .cf{font-size:12px;color:#4d6e5c;line-height:1.6;margin-top:8px;text-align:left}
.card-item.locked .cf{color:#9db0a6}
@media (max-width:420px){h1{font-size:26px}.qctx{font-size:17.5px}.opt{font-size:22px}.opts.txt .opt{font-size:17px}}
/* 听按钮卡片：整块可点，76px 高 */
.listen{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;
  padding:14px 18px;border-radius:16px;text-align:left;cursor:pointer;
  background:rgba(47,125,82,.07);border:2px solid rgba(47,125,82,.28);
  transition:transform .15s;font-family:inherit;-webkit-tap-highlight-color:transparent;
  margin-top:14px}
.listen:active{transform:scale(.98)}
.listen .li{font-size:28px;line-height:1;flex:0 0 auto}
.listen .lt{flex:1;min-width:0}
.listen b{display:block;font-size:17px;font-weight:800;color:#1D5C39;line-height:1.3}
.listen em{display:block;font-style:normal;font-size:12.5px;color:#5F584C;
  margin-top:3px;line-height:1.4}
.listen.off{background:#F4F1EC;border-color:#E4DCD0;cursor:default}
.listen.off b{color:#5F584C}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="overlay"></div>

<script src="fun.js?v=1021h"></script>
<script>
/* =========================================================
   《绿鳄王·虫虫大冒险》第二季
   学习目标：用乘法口诀解决问题（乘除法应用题）+ 100以内进退位加减法
   主题：昆虫与危险生物（蓝环章鱼、杀人蜂、水蛭…）
   纯离线单文件，手机浏览器直接打开即可玩
   ========================================================= */

var TIME_LIMIT = 20;                      // 限时挑战每题秒数
var PASS_LINE = 5;                        // 至少答对5题过关
var STORE_KEY = 'lvw-insect-v1';

/* ===== 生物设定（每关一个主题生物，题目里的"角色"） ===== */
var TH = {
  ant:      {who:'蚂蚁',   act:'搬', obj:'食物', wq:'个', home:'蚁巢',   leave:'爬走', emoji:'🐜'},
  bee:      {who:'蜜蜂',   act:'采', obj:'花蜜', wq:'滴', home:'蜂巢',   leave:'飞走', emoji:'🐝'},
  butterfly:{who:'蝴蝶',   act:'采', obj:'花',   wq:'朵', home:'花丛',   leave:'飞走', emoji:'🦋'},
  beetle:   {who:'独角仙', act:'搬', obj:'果子', wq:'个', home:'树洞',   leave:'爬走', emoji:'🪲'},
  mantis:   {who:'螳螂',   act:'抓', obj:'小虫', wq:'条', home:'草丛',   leave:'爬走', emoji:'🦗'},
  dragonfly:{who:'蜻蜓',   act:'捉', obj:'蚊子', wq:'只', home:'荷塘',   leave:'飞走', emoji:'🦟'},
  leech:    {who:'水蛭',   act:'吸', obj:'血',   wq:'滴', home:'沼泽',   leave:'游走', emoji:'🪱'},
  killer:   {who:'杀人蜂', act:'采', obj:'花蜜', wq:'滴', home:'蜂巢',   leave:'飞走', emoji:'🐝'},
  final:    {who:'虫子',   act:'搬', obj:'东西', wq:'个', home:'昆虫基地',leave:'走了', emoji:'🐛'}
};

/* ===== 关卡（9关，逐关解锁） ===== */
var LEVELS = [
  {name:'蚂蚁军团',      theme:'ant',       card:'ant',       types:['mul'],                      count:8},
  {name:'蜜蜂蜂巢',      theme:'bee',       card:'bee',       types:['divShare'],                 count:8, locked:true},
  {name:'蝴蝶花园',      theme:'butterfly', card:'butterfly',  types:['divGroup'],                 count:8, locked:true},
  {name:'独角仙擂台',    theme:'beetle',    card:'beetle',    types:['add','sub'],                count:8},
  {name:'螳螂草丛',      theme:'mantis',    card:'mantis',    types:['mul','add','sub'],          count:8},
  {name:'蜻蜓点水',      theme:'dragonfly', card:'dragonfly', types:['mul','add','sub'],          count:8},
  {name:'水蛭沼泽',      theme:'leech',     card:'leech',     types:['sub','add','more'],         count:8},
  {name:'杀人蜂警报',    theme:'killer',    card:'killer',    types:['mul','add','sub'],          count:8, hard:true},
  {name:'真假昆虫侦探',  theme:'final',     card:'octopus',   final:true,                         count:10}
];

/* ===== 生物卡图鉴（通关一关解锁一张） ===== */
var CARDS = {
  ant:       {emoji:'🐜', name:'蚂蚁',      fact:'蚂蚁是昆虫，有 6 条腿。一个蚁群里，蚁后负责生宝宝，工蚁负责找食物、照顾幼虫。'},
  bee:       {emoji:'🐝', name:'蜜蜂',      fact:'蜜蜂用跳舞告诉同伴花在哪里：跳"8 字舞"说明花在远处，跳"圆圈舞"说明花很近。'},
  butterfly: {emoji:'🦋', name:'蝴蝶',      fact:'蝴蝶长大要变四次：卵 → 幼虫 → 蛹 → 成虫。这叫"完全变态"，蜻蜓不用经过蛹。'},
  beetle:    {emoji:'🪲', name:'独角仙',    fact:'独角仙是甲虫，头上的角用来和别的雄虫比力气，它能举起比自己的身体重很多倍的东西。'},
  mantis:    {emoji:'🦗', name:'螳螂',      fact:'螳螂的前足像两把镰刀，专门抓虫子吃。它也是昆虫，有 6 条腿、身体分三段。'},
  dragonfly: {emoji:'🦟', name:'蜻蜓',      fact:'蜻蜓有两只大复眼，里面装着几万个小眼睛。它的幼虫叫"水虿"，生活在水里。'},
  leech:     {emoji:'🪱', name:'水蛭',      fact:'水蛭不是昆虫，是"环节动物"，身体一节一节的。它会分泌麻药，被咬时几乎不痛，医生有时用它帮忙吸掉淤血。'},
  killer:    {emoji:'🐝', name:'杀人蜂',    fact:'杀人蜂其实是"非洲化蜜蜂"，比普通蜜蜂更凶，会成群追人。不过它们采蜜更勤快，也怕烟。'},
  octopus:   {emoji:'🐙', name:'蓝环章鱼',  fact:'蓝环章鱼不是昆虫，是软体动物。身上的蓝环是"警告色"：我有剧毒，别碰我！'}
};

/* ===== 真假昆虫侦探（第9关的科学题） ===== */
var INSECTS    = [['🐜','蚂蚁'],['🐝','蜜蜂'],['🦋','蝴蝶'],['🪲','独角仙'],['🦗','螳螂'],['🦟','蜻蜓'],['🐞','瓢虫'],['🪳','蟑螂']];
var NONINSECTS = [['🕷️','蜘蛛'],['🐙','蓝环章鱼'],['🪱','水蛭'],['🦂','蝎子']];
function lbl(x){ return x[0] ? x[0]+' '+x[1] : x[1]; }

/* ===== 进度存档（localStorage，带容错） ===== */
var progress = {stars:{}, soundOn:true, achievements:{}, wrongBook:[], timed:false, cards:{}, maxCombo:0};
var storageAvailable = false;
try{
  localStorage.setItem('__test__','1');
  localStorage.removeItem('__test__');
  storageAvailable = true;
}catch(e){ storageAvailable = false; }
if(storageAvailable){
  try{
    var saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if(saved){ progress = Object.assign(progress, saved); }
  }catch(e){}
}
function save(){ if(storageAvailable){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} } }
/* 上一个"没被封门"的关卡：算解锁条件时跳过 locked 的关 */
function prevOpen(i){ for(var j=i-1;j>=0;j--){ if(!LEVELS[j].locked) return j; } return -1; }
function isUnlocked(i){
  if(LEVELS[i].locked) return false;
  var p = prevOpen(i);
  return p<0 || !!(progress.stars[p] && progress.stars[p]>0);
}
function cardCount(){ return Object.keys(progress.cards).filter(function(k){ return progress.cards[k]; }).length; }

/* ===== 成就 ===== */
var ACH = [
  {id:'first_pass', icon:'🎉', name:'首次通关',   desc:'闯过任意一关'},
  {id:'collector',  icon:'🗂️', name:'图鉴收集家', desc:'收集 8 张生物卡'},
  {id:'combo10',    icon:'🔥', name:'连击高手',   desc:'连续答对 10 题'},
  {id:'combo20',    icon:'💥', name:'超级连击',   desc:'连续答对 20 题'},
  {id:'fix_all',    icon:'🛠️', name:'纠错小能手', desc:'把所有错题都订正好'},
  {id:'detective',  icon:'🔍', name:'昆虫学家',   desc:'通关全部关卡'}
];
var ACH_MAP = {}; ACH.forEach(function(a){ ACH_MAP[a.id]=a; });
var pendingAch = [], achShowing = false;
function unlock(id){
  if(progress.achievements[id]) return;
  progress.achievements[id] = true;
  save();
  pendingAch.push(id);
  showNextAch();
}
function showNextAch(){
  if(achShowing) return;
  var id = pendingAch.shift();
  if(!id) return;
  var a = ACH_MAP[id]; if(!a) return;
  achShowing = true;
  var ov = document.getElementById('overlay');
  ov.className = 'show';
  ov.innerHTML = '<div class="ach-pop"><div class="ach-icon">'+a.icon+'</div>'+
    '<div class="ach-title">解锁成就</div><div class="ach-name">'+a.name+'</div>'+
    '<div class="ach-desc">'+a.desc+'</div>'+
    '<button class="btn mt16" id="achOk">太棒了</button></div>';
  document.getElementById('achOk').onclick = function(){
    ov.className=''; ov.innerHTML=''; achShowing=false;
    setTimeout(showNextAch, 150);
  };
}
function comboToast(n){
  var t = document.getElementById('toast');
  t.textContent = '🔥 '+n+' 连击！';
  t.className = 'show';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.className=''; }, 900);
}

/* ===== 错题本（整题保存，应用题不再是简单的 a×b） ===== */
function addWrong(q){
  for(var i=0;i<progress.wrongBook.length;i++){
    if(progress.wrongBook[i].ctx===q.ctx) return;
  }
  progress.wrongBook.push({ctx:q.ctx, ans:q.ans, options:q.options.slice(), hint:q.hint, theme:q.theme, type:q.type});
  save();
}
function removeWrong(q){
  progress.wrongBook = progress.wrongBook.filter(function(w){ return w.ctx!==q.ctx; });
  save();
}

/* ===== 游戏状态 ===== */
var state = {screen:'home', levelIdx:0, questions:[], qIndex:0, correct:0, answered:false, locked:false,
  combo:0, maxCombo:0, isRedo:false, timeLeft:0, lastStars:0};
var timerId = null;
function clearTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

/* ===== 工具 ===== */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* 选项生成：正确答案 + 3 个"典型错误"干扰项（这是第二季的核心升级） */
function pickOptions(ans, cands){
  var set = {}; set[String(ans)] = true;
  var out = [String(ans)];
  for(var i=0;i<cands.length && out.length<4;i++){
    var v = cands[i];
    if(typeof v !== 'number' || !isFinite(v)) continue;
    if(v>0 && !set[String(v)]){ set[String(v)]=true; out.push(String(v)); }
  }
  var d = 3;
  while(out.length<4 && d<200){
    var v = ans + d;
    if(!set[String(v)]){ set[String(v)]=true; out.push(String(v)); }
    d += 3;
  }
  return shuffle(out);
}

/* ===== 出题（应用题引擎） ===== */
function genMath(level, type){
  var th = TH[level.theme], hard = !!level.hard;
  var a,b,x,y,ans,ctx,hint,opts;
  var who = th.who, home = th.home;

  if(type==='mul'){
    a = hard ? 6+rnd(4) : 2+rnd(8);
    b = hard ? 6+rnd(4) : 2+rnd(8);
    ans = a*b;
    ctx  = '每只'+who+th.act+' '+a+' '+th.wq+th.obj+'，'+b+' 只'+who+'一共'+th.act+'了多少'+th.wq+th.obj+'？';
    hint = a+' × '+b+' = '+ans;
    opts = pickOptions(ans, [a*(b-1), a*(b+1), ans+a, ans-a, ans+10, ans-10]);
  }
  else if(type==='divShare'){
    a = hard ? 6+rnd(4) : 2+rnd(8);
    b = 2+rnd(4);
    var T = a*b;
    ans = a;
    ctx  = '有 '+T+' '+th.wq+th.obj+'，平均分给 '+b+' 只'+who+'，每只分到多少'+th.wq+th.obj+'？';
    hint = T+' ÷ '+b+' = '+a+'　（'+b+' × '+a+' = '+T+'）';
    opts = pickOptions(ans, [T-b, a+1, a-1, a+b, T+b]);
  }
  else if(type==='divGroup'){
    a = 2+rnd(7); b = 2+rnd(4); var T2 = a*b;
    ans = a;
    ctx  = '有 '+T2+' 只'+who+'，每 '+b+' 只住一个'+home+'，需要几个'+home+'？';
    hint = T2+' ÷ '+b+' = '+a+'　（'+b+' × '+a+' = '+T2+'）';
    opts = pickOptions(ans, [T2-b, a+1, a-1, a+2, T2+b]);
  }
  else if(type==='add'){
    var xp = 2+rnd(8);            // 个位 2..9
    var yq = (10-xp)+rnd(xp);     // 保证个位相加 ≥ 10（进位）
    x = (2+rnd(5))*10 + xp;       // 22..69
    y = (1+rnd(2))*10 + yq;       // 11..29
    ans = x+y;
    ctx  = home+'里原来有 '+x+' 只'+who+'，又来了 '+y+' 只，现在一共有多少只？';
    hint = x+' + '+y+' = '+ans+'　（个位相加满 10，要进位）';
    opts = pickOptions(ans, [Math.abs(x-y), ans-10, ans+10, ans+1, ans-1]);
  }
  else if(type==='sub'){
    var xp2 = rnd(9);             // 0..8
    var yq2 = xp2+1+rnd(9-xp2);   // 保证个位不够减（退位）
    x = (3+rnd(6))*10 + xp2;      // 30..89
    y = (1+rnd(2))*10 + yq2;      // 11..29
    ans = x-y;
    ctx  = home+'里原来有 '+x+' 只'+who+'，有 '+y+' 只'+th.leave+'了，还剩多少只？';
    hint = x+' - '+y+' = '+ans+'　（个位不够减，要退位）';
    opts = pickOptions(ans, [x+y, ans+10, ans-10, ans+2, ans-2]);
  }
  else if(type==='more'){
    var s = 12+rnd(40), d2 = 6+rnd(20);
    ans = s+d2;
    ctx  = '鱼塘里的'+who+'比旁边的多 '+d2+' 只，旁边有 '+s+' 只，鱼塘里有多少只'+who+'？';
    hint = s+' + '+d2+' = '+ans+'　（比谁多，就要加上多的部分）';
    opts = pickOptions(ans, [s-d2>0? s-d2 : s+d2+10, ans+10, ans-10, ans+1, ans-1]);
  }
  else if(type==='twoStep'){
    a = 3+rnd(5); b = 2+rnd(3);
    var tot = a*b;
    var cMax = Math.min(8, tot-1);          // 放走的最多 = 总数-1，保证答案 ≥1
    var c = 2+rnd(cMax-1);
    ans = tot-c;
    ctx  = '每盒装 '+a+' 只'+who+'，'+b+' 盒一共有多少只？后来有 '+c+' 只被放走了，还剩多少只？';
    hint = a+' × '+b+' = '+tot+'；'+tot+' - '+c+' = '+ans;
    opts = pickOptions(ans, [tot, tot+c, ans+1, ans-1]);
  }
  else { return null; }

  /* 把题目里的数字标成橙色，帮他把眼睛放到关键信息上（练读题） */
  ctx = ctx.replace(/(\d+)/g, '<b>$1</b>');
  return {type:type, ctx:ctx, ans:String(ans), hint:hint, options:opts, theme:level.theme};
}

/* 分类题：谁不是昆虫 / 谁是昆虫 */
function genClassify(){
  var findNon = rnd(2)===0;
  var ins = shuffle(INSECTS.slice()), non = shuffle(NONINSECTS.slice());
  var ansLabel, opts, ctx, hint;
  if(findNon){
    ansLabel = lbl(non[0]);
    opts = [lbl(ins[0]), lbl(ins[1]), lbl(ins[2]), ansLabel];
    ctx  = '哪一只<b>不是</b>昆虫？';
    hint = ansLabel.split(' ').pop()+' 不是昆虫。昆虫都有 6 条腿，身体分头、胸、腹三段。';
  }else{
    ansLabel = lbl(ins[0]);
    opts = [lbl(non[0]), lbl(non[1]), lbl(non[2]), ansLabel];
    ctx  = '哪一只是<b>真正的昆虫</b>？';
    hint = ansLabel.split(' ').pop()+' 才是昆虫，它有 6 条腿。';
  }
  return {type:'classify', ctx:ctx, ans:ansLabel, hint:hint, options:shuffle(opts), theme:'final'};
}

function genLevel(level){
  var qs = [];
  if(level.final){
    var plan = ['classify','classify','classify','twoStep','twoStep'].concat(
      ['mul','mul','more','add','sub']);
    plan = shuffle(plan);
    for(var k=0;k<plan.length && qs.length<level.count;k++){
      var q0 = plan[k]==='classify' ? genClassify() : genMath(level, plan[k]);
      if(q0) qs.push(q0);
    }
  }else{
    for(var i=0;i<level.count;i++){
      qs.push(genMath(level, pick(level.types)));
    }
  }
  /* 数学题随机一半改成"自己写答案"：必须算出结果再打进去，不能靠点选项蒙 */
  for(var m=0;m<qs.length;m++){
    if(qs[m].type!=='classify' && rnd(2)===0) qs[m].inputMode = true;
  }
  return qs;
}

/* ===== 音效（Web Audio，离线可用） ===== */
var actx=null;
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(freq, dur, type, when){
  if(!progress.soundOn || !actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  var t = actx.currentTime + (when||0);
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); o.start(t); o.stop(t+dur);
}
function sndRight(){ beep(523,.12,'sine',0); beep(659,.12,'sine',.1); beep(784,.18,'sine',.2); }
function sndWrong(){ beep(300,.18,'triangle',0); beep(220,.22,'triangle',.14); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ beep(f,.2,'sine',i*.13); }); }

function startTimer(){
  clearTimer();
  state.timeLeft = TIME_LIMIT;
  var tn = document.getElementById('tnum'), tb = document.getElementById('tbar');
  if(!tn) return;
  tn.textContent = TIME_LIMIT+'s'; tb.style.width='100%';
  timerId = setInterval(function(){
    state.timeLeft = Math.max(0, state.timeLeft-0.1);
    if(tn) tn.textContent = Math.ceil(state.timeLeft)+'s';
    if(tb) tb.style.width = (state.timeLeft/TIME_LIMIT*100)+'%';
    if(state.timeLeft<=0){ clearTimer(); answer(null, null); }
  }, 100);
}

function answer(v, btn){
  if(state.locked) return;
  clearTimer();
  var q = state.questions[state.qIndex];
  var fb = document.getElementById('fb');
  var btns = document.querySelectorAll('.opt');
  var inp = document.getElementById('ansInput');
  var isTimeout = (v===null && btn===null);
  var ok = (!isTimeout && String(v).trim()===q.ans);
  if(q.tries===undefined) q.tries = 0;

  /* 第一次答错不摊答案，给第二次机会——治"扫一眼就点" */
  if(!ok && q.tries===0 && !isTimeout){
    q.tries = 1;
    addWrong(q);          /* 第一次就错 = 真的没掌握，进错题本回炉 */
    if(btn) btn.classList.add('wrong');
    if(inp) inp.classList.add('wrong');
    fb.textContent = '再想想，还有一次机会';
    fb.className = 'feedback bad';
    sndWrong();
    PS.onWrong({quiet:true});
    setTimeout(function(){
      if(btn) btn.classList.remove('wrong');
      if(inp){ inp.classList.remove('wrong'); inp.value=''; try{ inp.focus(); }catch(e){} }
    }, 700);
    if(progress.timed) startTimer();
    return;
  }

  state.locked = true;
  var delay = 1200;
  if(ok){
    if(q.tries===0){
      state.correct++;
      state.combo++;
      if(state.combo>state.maxCombo) state.maxCombo=state.combo;
      if(state.combo>progress.maxCombo){ progress.maxCombo=state.combo; save(); }
      var praise = PRAISE[rnd(PRAISE.length)];
      if(state.combo>=2) praise += '（🔥 '+state.combo+' 连击）';
      fb.textContent = praise;
      if(state.combo===2 || state.combo%5===0) comboToast(state.combo);
      if(state.combo>=10) unlock('combo10');
      if(state.combo>=20) unlock('combo20');
    }else{
      /* 第二次才答对：算他会了，但不计正确分，否则星级虚高 */
      fb.textContent = '想对了！记住这个：'+q.hint;
    }
    fb.className='feedback good';
    if(btn) btn.classList.add('right');
    if(inp) inp.classList.add('right');
    sndRight();
    PS.onRight({quiet:true});
    if(state.isRedo) removeWrong(q);
  }else{
    state.combo = 0;
    delay = 4000;
    if(btn) btn.classList.add('wrong');
    if(inp) inp.classList.add('wrong');
    fb.innerHTML = CHEER[rnd(CHEER.length)]+'<br>正确答案：<b>'+q.ans+'</b>'+
      (q.hint ? '<br>'+(q.type==='classify'?'':'算式 ')+q.hint : '');
    fb.className='feedback bad';
    sndWrong();
    PS.onWrong({quiet:true});
    addWrong(q);
    for(var i=0;i<btns.length;i++){
      if(btns[i].getAttribute('data-v')===q.ans) btns[i].classList.add('show');
    }
  }
  for(var k=0;k<btns.length;k++) btns[k].disabled=true;
  if(inp) inp.disabled = true;
  var bar=document.querySelector('.progress > i');
  if(bar) bar.style.width = Math.round((state.qIndex+1)/state.questions.length*100)+'%';

  setTimeout(function(){
    state.qIndex++;
    state.locked=false;
    if(state.qIndex>=state.questions.length){
      finishLevel();
    }else{
      render();
    }
  }, delay);
}

function finishLevel(){
  clearTimer();
  var c = state.correct;
  var stars = 0;
  var newCard = null;
  /* 一局打完喂一次绿鳄王（趣味层，与星级无关） */
  try { PS.finishRound({ subj:'数学应用题', right: state.correct, total: state.questions.length }); } catch(e){}
  if(!state.isRedo){
    if(c >= state.questions.length) stars=3;
    else if(c >= state.questions.length-1) stars=2;
    else if(c >= PASS_LINE) stars=1;
    if(stars>0){
      var prev = progress.stars[state.levelIdx]||0;
      if(stars>prev) progress.stars[state.levelIdx]=stars;
      var ck = LEVELS[state.levelIdx].card;
      /* 解锁新图鉴卡：记下时间，跳一下 + 解锁音效 */
      if(ck && !progress.cards[ck]){
        progress.cards[ck] = Date.now();
        newCard = CARDS[ck];
        try { PS.sndUnlock(); } catch(e){}
      }
      save();
      unlock('first_pass');
      if(cardCount()>=8) unlock('collector');
      var passed = Object.keys(progress.stars).filter(function(k){return progress.stars[k]>0;}).length;
      if(passed===LEVELS.length) unlock('detective');
      sndWin();
    }
  }else{
    if(progress.wrongBook.length===0){ unlock('fix_all'); sndWin(); }
  }
  state.lastStars = stars;
  state.newCard = newCard;
  state.screen='result';
  render();
}

function renderResult(){
  var total = state.questions.length;
  var c = state.correct;
  var stars = state.lastStars;
  var html='<div class="screen">'+mascot();
  if(state.isRedo){
    var left = progress.wrongBook.length;
    if(left===0){
      html+='<h1>错题订正完啦！</h1>'+
        '<p class="scoreline" style="margin-top:12px">刚才的错题全都做对咯</p>'+
        '<p class="sub">绿鳄王给你鼓掌！这些题从此就变成你的本领啦。</p>';
    }else{
      html+='<h1>还有一点点</h1>'+
        '<p class="scoreline" style="margin-top:12px">还有 '+left+' 道错题要多练几次</p>'+
        '<p class="sub">别着急，多练两遍就记住啦，绿鳄王陪着你！</p>';
    }
    if(left>0){ html+='<button class="btn mt16" id="redoBtn">继续订正错题 ('+left+')</button>'; }
    html+='<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
  }else{
    var pass = stars>0;
    var hasNext = state.levelIdx < LEVELS.length-1;
    if(pass){
      html+='<h1>过关啦！</h1>'+
        '<div class="bigstars">'+starStr(stars)+'</div>'+
        '<p class="scoreline">答对 '+c+' / '+total+' 题</p>';
      if(state.newCard){
        html+='<div class="bcard"><div class="be">'+state.newCard.emoji+'</div>'+
          '<div class="bn">'+state.newCard.name+'<span class="newtag">新图鉴卡</span></div>'+
          '<div class="bf">'+state.newCard.fact+'</div></div>';
      }else{
        html+='<p class="sub">绿鳄王说：这一关你已经拿下过啦，还是那么稳！</p>';
      }
      if(hasNext){
        html+='<button class="btn gold mt16" id="nextBtn">下一关</button>';
      }else{
        html+='<div style="text-align:center" class="mt12"><span class="badge">你通关了全部关卡！</span></div>';
      }
      if(progress.wrongBook.length>0){
        html+='<button class="btn mt12" id="redoBtn">重做错题 ('+progress.wrongBook.length+')</button>';
      }
      html+='<button class="btn ghost mt12" id="colBtn">📖 看看我的图鉴</button>'+
            '<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
    }else{
      html+='<h1>差一点点</h1>'+
        '<p class="scoreline" style="margin-top:12px">答对 '+c+' / '+total+' 题</p>'+
        '<p class="sub">再答对几题就能过关啦，绿鳄王陪你再试一次！</p>'+
        '<button class="btn mt16" id="retryBtn">再玩一次</button>'+
        (progress.wrongBook.length>0?'<button class="btn mt12" id="redoBtn">重做错题 ('+progress.wrongBook.length+')</button>':'')+
        '<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
    }
  }
  html+=soundBtn()+'</div>';
  app.innerHTML=html;
  var nb=document.getElementById('nextBtn');
  if(nb) nb.onclick=function(){ startLevel(state.levelIdx+1); };
  var rb=document.getElementById('retryBtn');
  if(rb) rb.onclick=function(){ startLevel(state.levelIdx); };
  var db=document.getElementById('redoBtn');
  if(db) db.onclick=function(){ startRedo(); };
  var cb=document.getElementById('colBtn');
  if(cb) cb.onclick=function(){ state.screen='collection'; render(); };
  document.getElementById('mapBtn').onclick=function(){state.screen='levels';render();};
  bindSound();
}

/* ===== 动作 ===== */
function startLevel(i){
  state.levelIdx=i;
  state.isRedo=false;
  state.questions = genLevel(LEVELS[i]);
  state.qIndex=0; state.correct=0; state.locked=false; state.combo=0;
  state.newCard=null;
  state.screen='play';
  render();
}
function startRedo(){
  var list = progress.wrongBook.slice(0,8);
  if(list.length===0){ state.screen='levels'; render(); return; }
  state.isRedo=true;
  state.questions = list.map(function(w){
    return {type:w.type, ctx:w.ctx, ans:w.ans, hint:w.hint, theme:w.theme, options: shuffle(w.options.slice())};
  });
  state.qIndex=0; state.correct=0; state.locked=false; state.combo=0;
  state.newCard=null;
  state.screen='play';
  render();
}
function goNextUnplayed(){
  var idx=0;
  for(var i=0;i<LEVELS.length;i++){
    if(!progress.stars[i]){ idx=i; break; }
    idx=i;
  }
  startLevel(idx);
}

/* ===== 声音开关 ===== */
/* ---------- 念题（语音朗读） ---------- */
var TTS_OK = (typeof window.speechSynthesis !== 'undefined') && (typeof window.SpeechSynthesisUtterance !== 'undefined');
function plainText(s){ return String(s||'').replace(/<[^>]+>/g,''); }
function speakMath(t){
  if(!TTS_OK) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(plainText(t));
    u.lang='zh-CN'; u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function listenCard(){
  if(!TTS_OK) return '<div class="listen off"><span class="li">🔇</span><span class="lt"><b>让爸爸妈妈念给你听</b><em>这个浏览器不能自动朗读</em></span></div>';
  return '<button class="listen" id="speakQBtn"><span class="li">🔊</span><span class="lt"><b>念题</b><em>读不懂的字可以听</em></span></button>';
}

function soundBtn(){
  var icon;
  if(progress.soundOn){
    icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1F7A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
  }else{
    icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9db0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  }
  return '<button class="sound" id="soundBtn" title="声音开关">'+icon+'</button>';
}
function bindSound(){
  var b=document.getElementById('soundBtn');
  if(b) b.onclick=function(){
    progress.soundOn=!progress.soundOn;
    if(progress.soundOn){ ensureAudio(); }
    save(); render();
  };
}

render();
</script>
