<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绿鳄王乘法大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232E9E5B'/%3E%3Ctext x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3E%C3%97%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green:#2E9E5B; --green-dark:#1F7A45; --green-deep:#173B2A;
  --yellow:#FFC53D; --orange:#FF8A3D; --red:#E85D5D;
  --bg1:#EAF7EF; --bg2:#DDF0E4; --card:#FFFFFF;
  --shadow:0 10px 30px rgba(23,59,42,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--green-deep);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
#app{width:100%;max-width:560px}
.screen{background:var(--card);border-radius:28px;box-shadow:var(--shadow);
  padding:28px 24px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:30px;font-weight:900;line-height:1.2;text-align:center}
.sub{text-align:center;color:#5a7a68;font-size:15px;margin-top:8px}
.mascot{display:block;margin:0 auto 8px;width:150px;height:150px}
.btn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
  font-weight:700;border-radius:18px;font-size:19px;padding:17px;color:#fff;
  background:var(--green);min-height:54px;transition:transform .1s,background .2s;
  box-shadow:0 6px 0 var(--green-dark)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-dark)}
.btn.ghost{background:#eef6f1;color:var(--green-dark);box-shadow:0 6px 0 #cfe4d8}
.btn.ghost:active{box-shadow:0 2px 0 #cfe4d8}
.btn.gold{background:var(--yellow);color:#7a5200;box-shadow:0 6px 0 #e0a81f}
.btn.gold:active{box-shadow:0 2px 0 #e0a81f}
.mt12{margin-top:12px}.mt16{margin-top:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lvl-name{font-size:17px;font-weight:700}
.progress{height:12px;background:#e6f1ea;border-radius:8px;overflow:hidden;margin:6px 0 18px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#58c984);
  border-radius:8px;transition:width .3s}
.qbox{text-align:center;background:#f4faf6;border-radius:22px;padding:26px 16px;margin-bottom:18px}
.qctx{font-size:16px;color:#5a7a68;line-height:1.5;margin-bottom:14px;font-weight:500}
.qtext{font-size:40px;font-weight:900;letter-spacing:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:3px solid #dcebe2;background:#fff;border-radius:18px;font-size:26px;font-weight:700;
  padding:18px 0;cursor:pointer;font-family:inherit;color:var(--green-deep);min-height:64px;
  transition:transform .1s,background .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{background:var(--red);border-color:var(--red);color:#fff}
.opt.show{background:var(--green);border-color:var(--green);color:#fff}
.opt:disabled{cursor:default}
.feedback{text-align:center;font-size:18px;font-weight:700;min-height:28px;margin-top:14px}
.feedback.good{color:var(--green-dark)}.feedback.bad{color:var(--orange)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}

.level-card.locked .t{color:#9db0a6}
.stars{margin-top:6px;font-size:16px;letter-spacing:2px;color:#d8d8d8}
.stars .on{color:var(--yellow)}
.bigstars{text-align:center;font-size:52px;letter-spacing:6px;margin:10px 0;color:#d8d8d8}
.bigstars .on{color:var(--yellow);animation:starPop .5s ease both}
.bigstars .on:nth-child(2){animation-delay:.15s}.bigstars .on:nth-child(3){animation-delay:.3s}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.scoreline{text-align:center;font-size:18px;font-weight:700;margin-bottom:6px}
.sound{position:absolute;top:12px;right:12px;background:#fff;border:2px solid #dcebe2;
  border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;
  align-items:center;justify-content:center}
.badge{display:inline-block;background:#eaf7ef;color:var(--green-dark);border-radius:999px;
  padding:4px 14px;font-size:13px;font-weight:700;margin-top:10px}
.combo-badge{font-size:13px;font-weight:900;color:#fff;background:var(--orange);border-radius:999px;
  padding:3px 10px;margin-left:8px;display:inline-block;animation:comboPop .3s ease}
@keyframes comboPop{from{transform:scale(.5)}to{transform:scale(1)}}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--orange);color:#fff;font-weight:900;font-size:20px;padding:10px 22px;
  border-radius:999px;opacity:0;pointer-events:none;z-index:50;box-shadow:0 8px 20px rgba(255,138,61,.45);
  transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(23,59,42,.45);z-index:60;padding:24px}
#overlay.show{display:flex}
.ach-pop{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%;

@keyframes achIn{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ach-icon{font-size:56px;line-height:1}
.ach-title{font-size:14px;color:var(--green);font-weight:900;letter-spacing:2px;margin-top:6px}
.ach-name{font-size:24px;font-weight:900;margin-top:2px}
.ach-desc{font-size:15px;color:#5a7a68;margin-top:8px}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:14px}

.timer .tbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#FF6B3D);
  border-radius:6px;transition:width .1s linear}
.ach-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;text-align:left}
.ach-item{display:flex;align-items:center;gap:8px;background:#f4faf6;border-radius:14px;padding:10px 12px;font-size:13px}

@media (max-width:420px){h1{font-size:26px}.qtext{font-size:34px}.opt{font-size:22px}}

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="overlay"></div>

<script>
/* ===== 关卡定义（融入张蔚桐的兴趣） ===== */
var LEVELS = [
  {n:2, name:'2 的口诀', theme:'pokemon', themeName:'宝可梦森林', count:8},
  {n:3, name:'3 的口诀', theme:'shuihu', themeName:'梁山聚义厅', count:8},
  {n:4, name:'4 的口诀', theme:'biology', themeName:'深海生物馆', count:8},
  {n:5, name:'5 的口诀', theme:'robot', themeName:'威猛机器人', count:8},
  {n:6, name:'6 的口诀', theme:'pokemon', themeName:'宝可梦道馆', count:8},
  {n:7, name:'7 的口诀', theme:'shuihu', themeName:'水泊梁山', count:8},
  {n:8, name:'8 的口诀', theme:'biology', themeName:'热带雨林', count:8},
  {n:9, name:'9 的口诀', theme:'robot', themeName:'机器人实验室', count:8},
  {n:0, mixed:true, theme:'mixed', themeName:'终极大挑战', name:'混合大挑战', count:10}
];
var PASS_LINE = 5; // 至少答对5题过关
var STORE_KEY = 'lvw-multiplication-v1';

/* ===== 进度（localStorage） ===== */
var progress = {stars:{}, soundOn:true, achievements:{}, wrongBook:[], timed:false, maxCombo:0};
var storageAvailable = false;
try{
  localStorage.setItem('__test__', '1');
  localStorage.removeItem('__test__');
  storageAvailable = true;
}catch(e){ storageAvailable = false; }
if(storageAvailable){
  try{
    var saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if(saved){ progress = Object.assign(progress, saved); }
  }catch(e){}
}
function save(){ if(storageAvailable){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} } }
function isUnlocked(i){ return i===0 || (progress.stars[i-1] && progress.stars[i-1]>0); }

/* ===== 成就系统 ===== */
var ACH = [
  {id:'first_pass', icon:'🎉', name:'首次通关', desc:'闯过任意一关'},
  {id:'star3', icon:'⭐', name:'三星达人', desc:'某关全部答对拿 3 星'},
  {id:'combo10', icon:'🔥', name:'连击高手', desc:'连续答对 10 题'},
  {id:'combo20', icon:'💥', name:'超级连击', desc:'连续答对 20 题'},
  {id:'fix_all', icon:'🛠️', name:'纠错小能手', desc:'把所有错题都订正好'},
  {id:'all_pass', icon:'👑', name:'乘法大师', desc:'通关全部关卡'}
];
var ACH_MAP = {}; ACH.forEach(function(a){ ACH_MAP[a.id]=a; });
var pendingAch = [], achShowing = false;
function unlock(id){
  if(progress.achievements[id]) return;
  progress.achievements[id] = true;
  save();
  pendingAch.push(id);
  showNextAch();
}
function showNextAch(){
  if(achShowing) return;
  var id = pendingAch.shift();
  if(!id) return;
  var a = ACH_MAP[id]; if(!a) return;
  achShowing = true;
  var ov = document.getElementById('overlay');
  ov.className = 'show';
  ov.innerHTML = '<div class="ach-pop"><div class="ach-icon">'+a.icon+'</div>'+
    '<div class="ach-title">解锁成就</div><div class="ach-name">'+a.name+'</div>'+
    '<div class="ach-desc">'+a.desc+'</div>'+
    '<button class="btn mt16" id="achOk">太棒了</button></div>';
  document.getElementById('achOk').onclick = function(){
    ov.className=''; ov.innerHTML=''; achShowing=false;
    setTimeout(showNextAch, 150);
  };
}
function comboToast(n){
  var t = document.getElementById('toast');
  t.textContent = '🔥 '+n+' 连击！';
  t.className = 'show';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.className=''; }, 900);
}

/* ===== 错题本 ===== */
function addWrong(q){
  for(var i=0;i<progress.wrongBook.length;i++){
    if(progress.wrongBook[i].a===q.a && progress.wrongBook[i].b===q.b) return;
  }
  progress.wrongBook.push({a:q.a, b:q.b, ans:q.ans, ctx:q.ctx, theme:q.theme});
  save();
}
function removeWrong(q){
  progress.wrongBook = progress.wrongBook.filter(function(w){ return !(w.a===q.a && w.b===q.b); });
  save();
}

/* ===== 游戏状态 ===== */
var state = {screen:'home', levelIdx:0, questions:[], qIndex:0, correct:0, answered:false, locked:false, combo:0, maxCombo:0, isRedo:false, timeLeft:0};
var timerId = null;
function clearTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

/* ===== 工具 ===== */
function rnd(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* ===== 情境题模板（张蔚桐的兴趣联想） ===== */
var CONTEXTS = {
  pokemon: [
    '{a} 只甲贺忍蛙，每只扔 {b} 个水手里剑，一共扔了多少个？',
    '卡比兽一顿吃 {a} 碗饭，一天吃 {b} 顿，一共吃了多少碗？',
    '{a} 只皮卡丘，每只放 {b} 次十万伏特，一共放了多少次？',
    '长毛巨魔一拳打倒 {a} 个对手，打了 {b} 拳，一共打倒多少个？',
    '{a} 个精灵球，每个装 {b} 只宝可梦，一共能装多少只？',
    '喷火龙一次飞 {a} 米，飞了 {b} 次，一共飞了多少米？'
  ],
  shuihu: [
    '{a} 个梁山好汉，每人喝 {b} 碗酒，一共喝了多少碗？',
    '武松一顿吃 {a} 斤牛肉，吃了 {b} 顿，一共吃了多少斤？',
    '{a} 位好汉，每人有 {b} 件兵器，一共有多少件兵器？',
    '林冲一次打败 {a} 个敌人，打了 {b} 次，一共打败多少个？',
    '{a} 艘战船，每艘坐 {b} 个水军，一共能坐多少人？',
    '鲁智深一次倒拔 {a} 棵树，拔了 {b} 次，一共拔了多少棵？'
  ],
  biology: [
    '{a} 条蝠鲼，每条生 {b} 条小鱼，一共生了多少条？',
    '水蛭一次吸 {a} 滴血，吸了 {b} 次，一共吸了多少滴？',
    '{a} 只蝴蝶，每只产 {b} 个卵，一共产了多少个？',
    '章鱼有 {a} 条触手，{b} 只章鱼一共有多少条触手？',
    '{a} 棵大树，每棵上有 {b} 只鸟，一共有多少只鸟？',
    '蜜蜂一次采 {a} 朵花的蜜，采了 {b} 次，一共采了多少朵？'
  ],
  robot: [
    '{a} 个威猛机器人，每个打 {b} 个怪兽，一共打了多少个？',
    '机器人一分钟走 {a} 步，走了 {b} 分钟，一共走了多少步？',
    '{a} 个机器人，每个有 {b} 个按钮，一共有多少个按钮？',
    '机器人一次发射 {a} 发子弹，发射了 {b} 次，一共发射多少发？',
    '{a} 个机器人，每个举 {b} 下哑铃，一共举了多少下？',
    '机器人一秒算 {a} 道题，算了 {b} 秒，一共算了多少道？'
  ],
  mixed: [
    '{a} 组小朋友，每组 {b} 人，一共有多少人？',
    '一盒铅笔有 {a} 支，{b} 盒一共有多少支？',
    '{a} 行树，每行 {b} 棵，一共有多少棵？',
    '每排有 {a} 个座位，{b} 排一共有多少个座位？',
    '{a} 天，每天写 {b} 个字，一共写了多少个字？'
  ]
};

function pickContext(theme, a, b){
  var arr = CONTEXTS[theme] || CONTEXTS.mixed;
  var tpl = arr[rnd(arr.length)];
  // 避免 a 比 b 大太多导致情境不合理，交换一下让大数在前
  var big = Math.max(a,b), small = Math.min(a,b);
  return tpl.replace('{a}', big).replace('{b}', small);
}

/* ===== 出题 ===== */
function buildDistractors(a,b,ans){
  var set = {}; set[ans]=true;
  var tries = 0;
  while(Object.keys(set).length < 4 && tries < 50){
    var delta;
    var pick = rnd(4);
    if(pick===0) delta = (b>1? -a : a);
    else if(pick===1) delta = a;
    else if(pick===2) delta = (rnd(2)? 1 : -1);
    else delta = (rnd(2)? 2 : -2);
    var v = ans + delta;
    if(v>0 && v!==ans) set[v]=true;
    tries++;
  }
  var keys = Object.keys(set).map(Number);
  while(keys.length<4){ var extra = ans+keys.length+1; if(!set[extra]){set[extra]=1;keys.push(extra);} }
  return keys;
}
function genQuestion(level){
  var a,b;
  if(level.mixed){ a = 2+rnd(8); b = 1+rnd(9); }
  else { a = level.n; b = 1+rnd(9); }
  var ans = a*b;
  return {a:a, b:b, ans:ans, options: shuffle(buildDistractors(a,b,ans)), ctx: pickContext(level.theme, a, b), theme: level.theme};
}
function genLevel(level){
  var qs=[], seen={};
  for(var i=0;i<level.count;i++){
    var q, key, guard=0;
    do{ q=genQuestion(level); key=q.a+'x'+q.b; guard++; }while(seen[key] && guard<30 && !level.mixed);
    seen[key]=1; qs.push(q);
  }
  return qs;
}

/* ===== 音效（Web Audio） ===== */
var actx=null;
function ensureAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(freq, dur, type, when){
  if(!progress.soundOn || !actx) return;
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  var t = actx.currentTime + (when||0);
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); o.start(t); o.stop(t+dur);
}
function sndRight(){ beep(523,.12,'sine',0); beep(659,.12,'sine',.1); beep(784,.18,'sine',.2); }
function sndWrong(){ beep(300,.18,'triangle',0); beep(220,.22,'triangle',.14); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ beep(f,.2,'sine',i*.13); }); }

/* ===== 绿鳄王 SVG ===== */
function mascot(){
  return '<svg class="mascot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'
  +'<ellipse cx="100" cy="180" rx="55" ry="10" fill="rgba(0,0,0,.08)"/>'
  +'<g class="gator">'

  +'<rect x="52" y="100" width="96" height="44" rx="22" fill="#268a4e"/>'
  +'<circle cx="76" cy="86" r="13" fill="#fff"/><circle cx="76" cy="86" r="6" fill="#173B2A"/>'
  +'<circle cx="124" cy="86" r="13" fill="#fff"/><circle cx="124" cy="86" r="6" fill="#173B2A"/>'

  +'<polygon points="126,108 132,120 138,108" fill="#fff"/>'

  +'<rect x="40" y="66" width="14" height="30" rx="7" fill="#2E9E5B"/>'

function starStr(n){ var s=''; for(var i=0;i<3;i++){ s += '<span class="'+(i<n?'on':'')+'">★</span>'; } return s; }

/* ===== 鼓励语（融入张蔚桐的兴趣） ===== */
var PRAISE = [
  '太棒了！甲贺忍蛙为你点赞！',
  '答对啦！卡比兽都觉得你厉害！',
  '你真厉害！武松打虎，你打题！',
  '绿鳄王为你鼓掌！蝠鲼都为你欢呼！',
  '哇，好聪明！威猛机器人给你敬个礼！',
  '小意思，难不倒你！长毛巨魔都服了！',
  '梁山好汉都说：这小子行！',
  '水蛭都惊呆了，你算得真快！'
];
var CHEER = [
  '没关系，绿鳄王陪你继续，甲贺忍蛙也在给你加油！',
  '差一点点，再想想，卡比兽相信你！',
  '别灰心，下一题加油，武松也有打不过虎的时候！',
  '深呼吸，我们再来，蝠鲼陪你慢慢想！',
  '没事，威猛机器人也有卡住的时候，再来一次！'
];

/* ===== 渲染 ===== */
var app = document.getElementById('app');
function render(){
  clearTimer();
  if(state.screen==='home') renderHome();
  else if(state.screen==='levels') renderLevels();
  else if(state.screen==='play') renderPlay();
  else if(state.screen==='result') renderResult();
  else if(state.screen==='ach') renderAch();
}

function renderHome(){
  var total = Object.keys(progress.stars).filter(function(k){return progress.stars[k]>0;}).length;
  var achN = Object.keys(progress.achievements).filter(function(k){return progress.achievements[k];}).length;
  var done = total===LEVELS.length;
  app.innerHTML =
    '<div class="screen">'+mascot()+
    '<h1>绿鳄王乘法大冒险</h1>'+
    '<p class="sub">和绿鳄王一起，一关一关闯过乘法口诀！</p>'+
    '<div style="text-align:center" class="mt12"><span class="badge">已通关 '+total+' / '+LEVELS.length+' 关</span> <span class="badge">成就 '+achN+' / '+ACH.length+'</span></div>'+
    '<button class="btn mt16" id="startBtn">'+(done?'再玩一次':'开始闯关')+'</button>'+
    '<button class="btn ghost mt12" id="mapBtn">选择关卡</button>'+
    '<button class="btn ghost mt12" id="timedBtn">⏱ 限时挑战：'+(progress.timed?'开（每题 15 秒）':'关')+'</button>'+
    '<button class="btn ghost mt12" id="achBtn">🏆 我的成就</button>'+
    (done?'<p class="sub mt16" style="color:var(--green-dark);font-weight:700">全部关卡都被你拿下啦！</p>':'')+
    soundBtn()+
    '</div>';
  document.getElementById('startBtn').onclick = function(){ ensureAudio(); goNextUnplayed(); };
  document.getElementById('mapBtn').onclick = function(){ state.screen='levels'; render(); };
  document.getElementById('timedBtn').onclick = function(){ progress.timed=!progress.timed; save(); render(); };
  document.getElementById('achBtn').onclick = function(){ state.screen='ach'; render(); };
  bindSound();
}

function renderLevels(){
  var html='<div class="screen"><div class="topbar"><button class="btn ghost" style="width:auto;padding:10px 18px" id="backBtn">← 返回</button><div class="lvl-name">选择关卡</div></div>';
  html+='<div class="levels">';
  for(var i=0;i<LEVELS.length;i++){
    var locked = !isUnlocked(i);
    var st = progress.stars[i]||0;
    html+='<div class="level-card '+(locked?'locked':'')+'" data-i="'+i+'">'+
      '<div class="n">'+(LEVELS[i].mixed?'大挑战':'第'+(i+1)+'关')+'</div>'+
      '<div class="t">'+LEVELS[i].themeName+'</div>'+
      '<div class="t" style="font-size:11px">'+LEVELS[i].name+'</div>'+
      (locked?'<div class="stars" style="display:flex;justify-content:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9db0a6" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>':'<div class="stars">'+starStr(st)+'</div>')+
      '</div>';
  }
  html+='</div>'+soundBtn()+'</div>';
  app.innerHTML=html;
  document.getElementById('backBtn').onclick=function(){state.screen='home';render();};
  var cards = document.querySelectorAll('.level-card');
  for(var k=0;k<cards.length;k++){
    cards[k].onclick=function(){
      var idx=+this.getAttribute('data-i');
      if(isUnlocked(idx)){ ensureAudio(); startLevel(idx); }
    };
  }
  bindSound();
}

function renderAch(){
  var html='<div class="screen"><div class="topbar"><button class="btn ghost" style="width:auto;padding:10px 18px" id="backBtn">← 返回</button><div class="lvl-name">我的成就</div></div>';
  html+='<div class="ach-list">';
  for(var i=0;i<ACH.length;i++){
    var a=ACH[i], got=!!progress.achievements[a.id];
    html+='<div class="ach-item '+(got?'':'locked')+'"><span class="ai">'+(got?a.icon:'🔒')+'</span>'+
      '<span><b>'+a.name+'</b><br><span style="color:#6b8a79">'+a.desc+'</span></span></div>';
  }
  html+='</div>'+soundBtn()+'</div>';
  app.innerHTML=html;
  document.getElementById('backBtn').onclick=function(){state.screen='home';render();};
  bindSound();
}

function renderPlay(){
  var q = state.questions[state.qIndex];
  var total = state.questions.length;
  var pct = Math.round((state.qIndex)/total*100);
  var title = state.isRedo ? '错题重做' : (LEVELS[state.levelIdx].themeName+' · '+LEVELS[state.levelIdx].name);
  var combo = state.combo>=2 ? '<span class="combo-badge">🔥 '+state.combo+' 连击</span>' : '';
  var html='<div class="screen"><div class="topbar">'+
    '<button class="btn ghost" style="width:auto;padding:10px 16px" id="quitBtn">退出</button>'+
    '<div class="lvl-name">'+title+combo+'</div></div>'+
    '<div class="progress"><i style="width:'+pct+'%"></i></div>';
  if(progress.timed){
    html+='<div class="timer"><span class="tnum" id="tnum">15s</span><span class="tbar"><i id="tbar" style="width:100%"></i></span></div>';
  }
  html+='<div class="qbox"><div class="qctx">'+q.ctx+'</div><div class="qtext">'+q.a+' × '+q.b+' = ?</div></div>'+
    '<div class="opts">';
  for(var i=0;i<q.options.length;i++){
    html+='<button class="opt" data-v="'+q.options[i]+'">'+q.options[i]+'</button>';
  }
  html+='</div><div class="feedback" id="fb"></div>'+soundBtn()+'</div>';
  app.innerHTML=html;
  document.getElementById('quitBtn').onclick=function(){ clearTimer(); state.screen='levels'; render(); };
  var btns=document.querySelectorAll('.opt');
  for(var k=0;k<btns.length;k++){
    btns[k].onclick=function(){ answer(+this.getAttribute('data-v'), this); };
  }
  bindSound();
  if(progress.timed) startTimer();
}
function startTimer(){
  clearTimer();
  state.timeLeft = 15;
  var tn = document.getElementById('tnum'), tb = document.getElementById('tbar');
  if(!tn) return;
  tn.textContent='15s'; tb.style.width='100%';
  timerId = setInterval(function(){
    state.timeLeft = Math.max(0, state.timeLeft-0.1);
    if(tn) tn.textContent = Math.ceil(state.timeLeft)+'s';
    if(tb) tb.style.width = (state.timeLeft/15*100)+'%';
    if(state.timeLeft<=0){ clearTimer(); answer(null, null); }
  }, 100);
}

function answer(v, btn){
  if(state.locked) return;
  clearTimer();
  var q = state.questions[state.qIndex];
  var fb = document.getElementById('fb');
  var btns = document.querySelectorAll('.opt');
  state.locked = true;
  if(v===q.ans){
    state.correct++;
    state.combo++;
    if(state.combo>state.maxCombo) state.maxCombo=state.combo;
    if(state.combo>progress.maxCombo){ progress.maxCombo=state.combo; save(); }
    if(btn) btn.classList.add('right');
    var praise = PRAISE[rnd(PRAISE.length)];
    if(state.combo>=2) praise += '（🔥 '+state.combo+' 连击）';
    fb.textContent = praise;
    fb.className='feedback good';
    sndRight();
    if(state.combo===2 || state.combo%5===0) comboToast(state.combo);
    if(state.combo>=10) unlock('combo10');
    if(state.combo>=20) unlock('combo20');
    if(state.isRedo) removeWrong(q);
  }else{
    state.combo = 0;
    if(btn) btn.classList.add('wrong');
    fb.textContent = CHEER[rnd(CHEER.length)]+'（正确答案 '+q.ans+'）';
    fb.className='feedback bad';
    sndWrong();
    addWrong(q);
    for(var i=0;i<btns.length;i++){
      if(+btns[i].getAttribute('data-v')===q.ans) btns[i].classList.add('show');
    }
  }
  for(var k=0;k<btns.length;k++) btns[k].disabled=true;
  // 进度条推进
  var bar=document.querySelector('.progress > i');
  if(bar) bar.style.width = Math.round((state.qIndex+1)/state.questions.length*100)+'%';

  setTimeout(function(){
    state.qIndex++;
    state.locked=false;
    if(state.qIndex>=state.questions.length){
      finishLevel();
    }else{
      render();
    }
  }, 1100);
}

function finishLevel(){
  clearTimer();
  var c = state.correct;
  var stars = 0;
  if(!state.isRedo){
    if(c >= state.questions.length) stars=3;
    else if(c >= state.questions.length-1) stars=2;
    else if(c >= PASS_LINE) stars=1;
    if(stars>0){
      var prev = progress.stars[state.levelIdx]||0;
      if(stars>prev) progress.stars[state.levelIdx]=stars;
      save();
      unlock('first_pass');
      if(stars===3) unlock('star3');
      var passed = Object.keys(progress.stars).filter(function(k){return progress.stars[k]>0;}).length;
      if(passed===LEVELS.length) unlock('all_pass');
      sndWin();
    }
  }else{
    if(progress.wrongBook.length===0){ unlock('fix_all'); sndWin(); }
  }
  state.lastStars = stars;
  state.screen='result';
  render();
}

function renderResult(){
  var total = state.questions.length;
  var c = state.correct;
  var stars = state.lastStars;
  var html='<div class="screen">'+mascot();
  if(state.isRedo){
    var left = progress.wrongBook.length;
    if(left===0){
      html+='<h1>错题订正完啦！</h1>'+
        '<p class="scoreline" style="margin-top:12px">刚才的错题全都做对咯</p>'+
        '<p class="sub">绿鳄王给你鼓掌！这些题从此就变成你的本领啦。</p>';
    }else{
      html+='<h1>还有一点点</h1>'+
        '<p class="scoreline" style="margin-top:12px">还有 '+left+' 道错题要多练几次</p>'+
        '<p class="sub">别着急，多练两遍就记住啦，绿鳄王陪着你！</p>';
    }
    if(left>0){ html+='<button class="btn mt16" id="redoBtn">继续订正错题 ('+left+')</button>'; }
    html+='<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
  }else{
    var pass = stars>0;
    var hasNext = state.levelIdx < LEVELS.length-1;
    if(pass){
      html+='<h1>过关啦！</h1>'+
        '<div class="bigstars">'+starStr(stars)+'</div>'+
        '<p class="scoreline">答对 '+c+' / '+total+' 题</p>'+
        '<p class="sub">'+(stars===3?'全部答对！甲贺忍蛙、卡比兽、梁山好汉都为你欢呼！':'绿鳄王说：你越来越棒了，继续闯关吧！')+'</p>';
      if(hasNext){
        html+='<button class="btn gold mt16" id="nextBtn">下一关</button>';
      }else{
        html+='<div style="text-align:center" class="mt12"><span class="badge">你通关了全部关卡！</span></div>';
      }
      if(progress.wrongBook.length>0){
        html+='<button class="btn mt12" id="redoBtn">重做错题 ('+progress.wrongBook.length+')</button>';
      }
      html+='<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
    }else{
      html+='<h1>差一点点</h1>'+
        '<p class="scoreline" style="margin-top:12px">答对 '+c+' / '+total+' 题</p>'+
        '<p class="sub">再答对几题就能过关啦，绿鳄王陪你再试一次！</p>'+
        '<button class="btn mt16" id="retryBtn">再玩一次</button>'+
        (progress.wrongBook.length>0?'<button class="btn mt12" id="redoBtn">重做错题 ('+progress.wrongBook.length+')</button>':'')+
        '<button class="btn ghost mt12" id="mapBtn">回关卡选择</button>';
    }
  }
  html+=soundBtn()+'</div>';
  app.innerHTML=html;
  var nb=document.getElementById('nextBtn');
  if(nb) nb.onclick=function(){ startLevel(state.levelIdx+1); };
  var rb=document.getElementById('retryBtn');
  if(rb) rb.onclick=function(){ startLevel(state.levelIdx); };
  var db=document.getElementById('redoBtn');
  if(db) db.onclick=function(){ startRedo(); };
  document.getElementById('mapBtn').onclick=function(){state.screen='levels';render();};
  bindSound();
}

/* ===== 动作 ===== */
function startLevel(i){
  state.levelIdx=i;
  state.isRedo=false;
  state.questions = genLevel(LEVELS[i]);
  state.qIndex=0; state.correct=0; state.locked=false; state.combo=0;
  state.screen='play';
  render();
}
function startRedo(){
  var list = progress.wrongBook.slice(0,8);
  if(list.length===0){ state.screen='levels'; render(); return; }
  state.isRedo=true;
  state.questions = list.map(function(w){
    return {a:w.a, b:w.b, ans:w.ans, ctx:w.ctx, theme:w.theme, options: shuffle(buildDistractors(w.a,w.b,w.ans))};
  });
  state.qIndex=0; state.correct=0; state.locked=false; state.combo=0;
  state.screen='play';
  render();
}
function goNextUnplayed(){
  var idx=0;
  for(var i=0;i<LEVELS.length;i++){
    if(!progress.stars[i]){ idx=i; break; }
    idx=i;
  }
  startLevel(idx);
}

/* ===== 声音开关 ===== */
function soundBtn(){
  var icon;
  if(progress.soundOn){
    icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1F7A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
  }else{
    icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9db0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  }
  return '<button class="sound" id="soundBtn" title="声音开关">'+icon+'</button>';
}
function bindSound(){
  var b=document.getElementById('soundBtn');
  if(b) b.onclick=function(){
    progress.soundOn=!progress.soundOn;
    if(progress.soundOn){ ensureAudio(); }
    save(); render();
  };
}

render();
</script>
</body>
</html>
